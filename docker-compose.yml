version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloud_docs
      MYSQL_USER: flaskuser
      MYSQL_PASSWORD: flaskpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app/backend
    working_dir: /app/backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=mysql+pymysql://flaskuser:flaskpass@mysql/cloud_docs
      - SECRET_KEY=dev-key
      # app.py uses relative imports, so it must load as a package:
      # PYTHONPATH points at the PARENT directory of backend/
      - FLASK_APP=backend.app
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      # Proxies in front of the backend that append to X-Forwarded-For:
      # just the frontend nginx here. See TRUSTED_PROXY_COUNT in config.py.
      - TRUSTED_PROXY_COUNT=1
    # Development deliberately keeps the Flask dev server: --debug enables hot
    # reload, which pairs with the bind mount above. Production uses the
    # Dockerfile CMD (gunicorn). Array form avoids wrapping in an extra shell.
    command: ["flask", "run", "--host=0.0.0.0", "--port=5001", "--debug"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: redis
    # Holds only disposable data (cache entries and rate-limit counters), so
    # persistence is off: a restart just means a cold cache and reset counters.
    # allkeys-lru evicts the least recently used keys if memory fills up.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    container_name: vue-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.53.4
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    container_name: grafana
    image: grafana/grafana:11.5.5
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/config.ini:/etc/grafana/grafana.ini
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/default.yaml
      - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/default.yaml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mysql_data:
