name: CD to GHCR

on:
  push:
    branches: [ main ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false      # Never cancel a deployment mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/doc-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR (per the OCI spec) requires lowercase image paths, but
      # repository_owner preserves the account's original casing.
      - name: Convert image repo to lowercase
        id: lower_repo
        run: echo "tag=$(echo $IMAGE_REPO | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Immutable tags: the commit SHA makes every running image traceable back
      # to the exact source it was built from. Publishing only :latest means
      # Kubernetes sees an unchanged tag and may not re-pull -- the deployment
      # silently does nothing -- and leaves no specific version to roll back to.
      - name: Compute image tags
        id: tags
        run: |
          echo "sha=${{ github.sha }}"          >> $GITHUB_OUTPUT
          echo "short=${GITHUB_SHA::7}"         >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in GITHUB_TOKEN is minted per run and expires with it, so
          # there is no long-lived credential to store, rotate or leak. It can
          # push to ghcr.io because the job declares packages: write above.
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------- Backend -----------------
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.lower_repo.outputs.tag }}:${{ steps.tags.outputs.sha }}
            ${{ steps.lower_repo.outputs.tag }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image (Trivy)
        # Third-party actions are pinned to a commit SHA rather than a tag:
        # a tag can be moved to point at different code, which is a supply
        # chain attack vector. First-party actions/* and docker/* are left on
        # major tags.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.lower_repo.outputs.tag }}:${{ steps.tags.outputs.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true      # Vulnerabilities with no available fix would block forever
          exit-code: '0'            # Observe first; set to '1' to make this a hard gate
          format: 'table'

      # ----------------- Frontend -----------------
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.lower_repo.outputs.tag }}-frontend:${{ steps.tags.outputs.sha }}
            ${{ steps.lower_repo.outputs.tag }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.lower_repo.outputs.tag }}-frontend:${{ steps.tags.outputs.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo ""
            echo '```'
            echo "${{ steps.lower_repo.outputs.tag }}:${{ steps.tags.outputs.sha }}"
            echo "${{ steps.lower_repo.outputs.tag }}-frontend:${{ steps.tags.outputs.sha }}"
            echo '```'
            echo ""
            echo "Deploy with:"
            echo '```bash'
            echo "kubectl set image deploy/backend  backend=${{ steps.lower_repo.outputs.tag }}:${{ steps.tags.outputs.sha }}"
            echo "kubectl set image deploy/frontend frontend=${{ steps.lower_repo.outputs.tag }}-frontend:${{ steps.tags.outputs.sha }}"
            echo "kubectl rollout status deploy/backend"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # TODO: this workflow stops after publishing images; deployment is still
      # manual. Next step is ArgoCD and a GitOps flow, where CD updates the image
      # tag in the manifests and the in-cluster agent pulls the change -- so
      # cluster credentials never leave the cluster.
