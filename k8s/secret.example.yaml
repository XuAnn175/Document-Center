# ===============================================================
# TEMPLATE ONLY - contains placeholder values and is safe to commit.
# Never write real secrets into a file. Create them directly in the
# cluster with the command below.
# ===============================================================
#
# Create (values go straight from your terminal into the cluster,
# never touching a file):
#
#   kubectl create secret generic doc-center-secrets \
#     --from-literal=mysql-root-password='<strong password>' \
#     --from-literal=mysql-password='<strong password>' \
#     --from-literal=secret-key="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     --from-literal=google-client-secret='<regenerated in Google Cloud Console>' \
#     --from-literal=database-url='mysql+pymysql://flaskuser:<same as mysql-password>@mysql/cloud_docs'
#
# Update a value:
#   kubectl create secret generic doc-center-secrets \
#     --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: a Kubernetes Secret is only base64 encoded, not encrypted.
# Anyone who can read Secrets in this namespace can decode it.
# Production additionally requires:
#   1. etcd encryption at rest (EncryptionConfiguration)
#   2. RBAC restricting who can read Secrets
#   3. External Secrets Operator / Vault as the real source of truth
# ===============================================================

apiVersion: v1
kind: Secret
metadata:
  name: doc-center-secrets
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME_root"
  mysql-password: "CHANGE_ME_flaskpass"
  secret-key: "CHANGE_ME_generate_with_secrets_token_urlsafe_48"
  google-client-secret: "CHANGE_ME_from_google_cloud_console"
  database-url: "mysql+pymysql://flaskuser:CHANGE_ME_flaskpass@mysql/cloud_docs"
