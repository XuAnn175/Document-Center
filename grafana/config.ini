# Grafana configuration for local development.
#
# This file used to be Grafana's full sample.ini (~460 lines), with everything
# commented out except the three settings below. It was trimmed because the
# commented-out sample values included a placeholder secret_key that tripped
# secret scanning, and because the active configuration was impossible to see
# at a glance.
#
# Full reference:
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
#
# Note: docker-compose mounts this file; the Kubernetes manifest currently does
# not, so the cluster runs with Grafana defaults.

[database]
log_queries =

[users]
# Viewers can inspect dashboard settings in the browser, but cannot save.
viewers_can_edit = true

[auth.anonymous]
# Development convenience: no login required. Do not enable anywhere reachable
# beyond the local machine -- it exposes every dashboard and the datasource
# proxy to anyone who can reach the port.
enabled = true
